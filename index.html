<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

    <title>Frontend Mentor | Product preview card component</title>

    <style>
      body {
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: hsl(30, 38%, 92%);
        font-family: 'Montserrat', sans-serif;
        font-size: 14px;
      }

      .card {
        display: flex;
        width: 100%;
        max-width: 600px;
        background-color: hsl(0, 0%, 100%);
        border-radius: 10px;
        overflow: hidden;
      }

      .card img.product {
        width: 50%;
        object-fit: cover;
      }

      .content {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 32px;
        width: 50%;
        box-sizing: border-box;
      }

      .category {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: hsl(228, 12%, 48%);
      }

      h1 {
        margin: 0;
        font-family: 'Fraunces', serif;
        font-size: 32px;
        font-weight: 700;
        line-height: 1.1;
        color: hsl(212, 21%, 14%);
      }

      .text {
        margin: 0;
        line-height: 1.5;
        color: hsl(228, 12%, 48%);
      }

      .prices {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .price {
        font-family: 'Fraunces', serif;
        font-size: 32px;
        font-weight: 700;
        color: hsl(158, 36%, 37%);
      }

      .original-price {
        text-decoration: line-through;
        color: hsl(228, 12%, 48%);
      }

      .btn {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background-color: hsl(158, 36%, 37%);
        color: white;
        font-family: 'Montserrat', sans-serif;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
      }

      .btn:hover {
        background-color: hsl(158, 42%, 18%);
      }

      @media (max-width: 600px) {
        .card {
          flex-direction: column;
          max-width: 340px;
        }

        .card img.product,
        .content {
          width: 100%;
        }

        .card img.product {
          height: 240px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <picture>
        <source media="(max-width: 600px)" srcset="images/image-product-mobile.jpg">
        <img class="product" src="images/image-product-desktop.jpg" alt="Gabrielle Essence Eau De Parfum bottle">
      </picture>
      <div class="content">
        <p class="category">Perfume</p>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p class="text">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
        <div class="prices">
          <span class="price">$149.99</span>
          <span class="original-price">$169.99</span>
        </div>
        <button class="btn">
          <img src="images/icon-cart.svg" alt="">
          Add to Cart
        </button>
      </div>
    </div>
  </body>
</html>
